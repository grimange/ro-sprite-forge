[package]
name = "rsf-korangar-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
[workspace]
[dependencies]
korangar-container = { path = "vendor/korangar-container" }
korangar-loaders = { path = "vendor/korangar-loaders" }
ragnarok-bytes = { path = "vendor/ragnarok-bytes", features = ["derive", "cgmath"] }
ragnarok-formats = { path = "vendor/ragnarok-formats" }
cgmath = "0.18"
num = "0.4"
hashbrown = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
fast-srgb8 = "1"
wgpu = { version = "29", default-features = false, features = ["vulkan", "spirv", "std"] }
bumpalo = {version="3", features=["allocator_api"]}
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
pollster = "0.4"
serde_json = "1"
sha2 = "0.10"
[features]
debug = []
