[build-system]
requires = ["setuptools==78.1.1", "wheel==0.46.3", "packaging==25.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ro-sprite-forge"
dynamic = ["version"]
description = "Local, human-operated Ragnarok animation tooling foundation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.scripts]
ro-sprite-forge = "ro_sprite_forge.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ro_sprite_forge.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ro_sprite_forge = ["schemas/*.json", "static/*"]

